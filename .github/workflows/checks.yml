name: World QA core checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and independent counterexamples
        run: python -m unittest discover -s tests -v
      - name: Generate passing synthetic report
        run: python -m worldqa inspect fixtures/good.json --output reports/synthetic-good
